name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # 공개 헤더에 SFML이 새지 않았는지 검사한다.
  # 빌드보다 훨씬 빠르므로 따로 떼어 먼저 실패하게 한다.
  # 기획서·UML의 핵심 요구사항(P3 의존성 은닉)을 사람이 아니라 CI가 지킨다.
  # ---------------------------------------------------------------------------
  headers:
    name: 공개 헤더 경계 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/check_headers.py

  # ---------------------------------------------------------------------------
  # 다른 프로젝트가 meno를 하위 프로젝트로 가져다 쓸 때
  # configure·빌드가 되는지와 해당 프로젝트의 캐시를 바꾸지 않는지를 검사한다.
  # ---------------------------------------------------------------------------
  consumer:
    name: 하위 프로젝트 빌드 (Ubuntu / GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 하위 프로젝트일 때 meno의 테스트는 꺼지므로,
      # tests/ 아래에 CMAKE_SOURCE_DIR가 다시 들어와도 아래 빌드로는 드러나지 않는다.
      - name: CMAKE_SOURCE_DIR 사용 금지
        run: |
          if git grep -nE '^[^#]*CMAKE_(SOURCE|BINARY)_DIR' -- '*CMakeLists.txt' '*.cmake'; then
            echo "::error::하위 프로젝트일 때 CMAKE_SOURCE_DIR·CMAKE_BINARY_DIR는 사용자 프로젝트를 가리킨다. PROJECT_SOURCE_DIR·PROJECT_BINARY_DIR를 쓸 것."
            exit 1
          fi

      - name: 시스템 의존성 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxrandr-dev libxcursor-dev libxi-dev libudev-dev \
            libfreetype-dev libgl1-mesa-dev libegl1-mesa-dev \
            libflac-dev libvorbis-dev libogg-dev \
            libharfbuzz-dev

      - name: SFML 빌드 캐시
        uses: actions/cache@v6
        with:
          path: build-consumer/_deps
          key: consumer-deps-${{ runner.os }}-sfml3.1.0-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: consumer-deps-${{ runner.os }}-sfml3.1.0-

      # meno를 추가한 뒤에도 빈 빌드 타입이 비어 있는지를 검사하기 위해, CMAKE_BUILD_TYPE을 고의로 주지 않는다.
      - name: Configure
        run: cmake -S tests/consumer -B build-consumer

      - name: Build
        run: cmake --build build-consumer --target game

  # ---------------------------------------------------------------------------
  # 빌드 + 테스트.
  #
  # 기획서 6-1은 "Windows/Linux × MSVC/GCC/Clang"(6조합)으로 적혀 있으나
  # Linux × MSVC 조합은 존재하지 않는다. 실제 의미 있는 2조합으로 시작하고,
  # 여유가 생기면 Ubuntu/Clang을 추가한다.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows / MSVC
            os: windows-latest
            cache-id: windows-msvc
            cmake-args: ""
          - name: Ubuntu / GCC
            os: ubuntu-latest
            cache-id: ubuntu-gcc
            cmake-args: ""
          # ② Ubuntu 러너에 기본으로 깔린 Clang을 쓴다.
          - name: Ubuntu / Clang
            os: ubuntu-latest
            cache-id: ubuntu-clang
            cmake-args: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++

    steps:
      - uses: actions/checkout@v7

      # SFML 3는 Linux에서 X11·udev·freetype 등의 개발 패키지를 요구한다.
      # xvfb와 fonts-dejavu-core는 창이 필요한 렌더 테스트(render) 용이다.
      - name: 시스템 의존성 설치 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxrandr-dev libxcursor-dev libxi-dev libudev-dev \
            libfreetype-dev libgl1-mesa-dev libegl1-mesa-dev \
            libflac-dev libvorbis-dev libogg-dev \
            libharfbuzz-dev \
            xvfb fonts-dejavu-core

      # SFML과 그 의존성 빌드가 10분쯤 걸린다. 캐시하지 않으면 매 푸시마다 낸다.
      - name: SFML 빌드 캐시
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: deps-${{ matrix.cache-id }}-sfml3.1.0-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-${{ matrix.cache-id }}-sfml3.1.0-

      # 설명서와 README의 C++ 코드 블록도 함께 컴파일한다(tests/guide). 이 옵션은 Python이 없으면
      # 저절로 꺼지므로, 러너에서 검사가 조용히 빠지지 않도록 명시적으로 켠다.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMENO_BUILD_GUIDE_CODE=ON ${{ matrix.cmake-args }}

      - name: Build
        run: cmake --build build --config Release

      # 값 타입 테스트는 창을 열지 않으므로 헤드리스 러너에서도 돈다.
      # render 테스트는 창과 GL 컨텍스트가 필요해서 MENO_DISPLAY_TESTS = 1일 때만 돈다.
      # Linux는 xvfb-run으로 가상 디스플레이를 띄워 함께 돌리고, Windows에서는 건너뛴다.
      # render_resize는 그린 픽셀의 색을 읽어 비교하므로 24비트 색 화면이 필요하다.
      # xvfb-run의 기본 화면은 배포판마다 달라서(8비트인 곳도 있다) 명시해 둔다.
      - name: Test (Linux)
        if: runner.os == 'Linux'
        env:
          MENO_DISPLAY_TESTS: "1"
        run: xvfb-run -a -s "-screen 0 1280x1024x24" ctest --test-dir build --build-config Release --output-on-failure

      - name: Test (Windows)
        if: runner.os != 'Linux'
        run: ctest --test-dir build --build-config Release --output-on-failure

  # ---------------------------------------------------------------------------
  # 메모리·미정의 동작 검사 (ASan + UBSan).
  # 수명 규칙을 바꾸는 Window, SceneManager의 안전망이다.
  # ---------------------------------------------------------------------------
  sanitizers:
    name: Ubuntu / Clang + ASan·UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 시스템 의존성 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxrandr-dev libxcursor-dev libxi-dev libudev-dev \
            libfreetype-dev libgl1-mesa-dev libegl1-mesa-dev \
            libflac-dev libvorbis-dev libogg-dev \
            libharfbuzz-dev \
            xvfb fonts-dejavu-core

      # SFML도 같은 플래그로 빌드되므로 일반 빌드와 캐시를 섞지 않는다.
      - name: SFML 빌드 캐시
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: deps-ubuntu-asan-sfml3.1.0-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-ubuntu-asan-sfml3.1.0-

      # -fno-sanitize-recover=undefined가 없으면 UBSan은 경고만 찍고 테스트는 통과한다.
      # 예제와 설명서 코드는 일반 빌드 잡이 이미 컴파일하므로 여기서는 끈다.
      - name: Configure
        env:
          SAN_FLAGS: -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DMENO_BUILD_EXAMPLES=OFF -DMENO_BUILD_GUIDE_CODE=OFF \
            "-DCMAKE_C_FLAGS=$SAN_FLAGS" \
            "-DCMAKE_CXX_FLAGS=$SAN_FLAGS" \
            "-DCMAKE_EXE_LINKER_FLAGS=$SAN_FLAGS"

      - name: Build
        run: cmake --build build --parallel

      # 누수 검사는 우선 끈다. xvfb·Mesa 드라이버가 남기는 할당을 LeakSanitizer가 누수로 보고하기 때문이다.
      # 오탐 범위를 확인한 뒤 suppression 파일로 좁혀서 다시 켠다.
      - name: Test
        env:
          MENO_DISPLAY_TESTS: "1"
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: xvfb-run -a -s "-screen 0 1280x1024x24" ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # 정적 분석 (clang-tidy). 처음에는 경고만 내고 실패시키지 않는다.
  # 규칙은 저장소 루트의 .clang-tidy에 있다.
  # ---------------------------------------------------------------------------
  tidy:
    name: clang-tidy (경고만)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 시스템 의존성 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy \
            libxrandr-dev libxcursor-dev libxi-dev libudev-dev \
            libfreetype-dev libgl1-mesa-dev libegl1-mesa-dev \
            libflac-dev libvorbis-dev libogg-dev \
            libharfbuzz-dev

      # 빌드하지 않는다. configure만으로 compile_commands.json과 SFML 소스(헤더)가 준비된다.
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DMENO_BUILD_TESTS=OFF -DMENO_BUILD_EXAMPLES=OFF

      # 라이브러리 소스만 검사한다. src/main.cpp는 어느 타깃에도 없어서 제외된다.
      - name: clang-tidy
        run: |
          clang-tidy --version
          git ls-files -z 'src/meno/*.cpp' | xargs -0 clang-tidy -p build --quiet

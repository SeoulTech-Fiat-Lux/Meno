name: Docs

# API 레퍼런스(Doxygen)를 빌드한다.
# PR에서는 빌드해서 Doxygen 경고가 없는지만 확인하고, main에 병합되면 GitHub Pages에 배포한다.

on:
  push:
    branches: [main]
    paths:
      - "include/**"
      - "docs/**"
      - "Doxyfile"
      - "README.md"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "include/**"
      - "docs/**"
      - "Doxyfile"
      - "README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# PR은 새 커밋이 오면 이전 실행을 취소한다. main 배포는 취소하지 않고 순서대로 처리한다.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # 로컬(MSYS2)과 같은 버전으로 고정한다.
  DOXYGEN_VERSION: "1.15.0"
  # GitHub 릴리스가 공개한 doxygen-1.15.0.linux.bin.tar.gz의 SHA-256. 버전을 올리면 함께 바꾼다.
  DOXYGEN_SHA256: "0ec2e5b2c3cd82b7106d19cb42d8466450730b8cb7a9e85af712be38bf4523a1"

jobs:
  # ---------------------------------------------------------------------------
  # 레퍼런스를 빌드하고 경고가 하나라도 있으면 실패한다.
  # Doxygen은 공식 릴리스 바이너리를 받아 체크섬을 확인한 뒤 캐시해 둔다.
  # ---------------------------------------------------------------------------
  build:
    name: Doxygen 레퍼런스
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Doxygen 캐시
        id: doxygen-cache
        uses: actions/cache@v6
        with:
          path: ~/doxygen
          key: doxygen-${{ env.DOXYGEN_VERSION }}-${{ runner.os }}

      - name: Doxygen 설치
        if: steps.doxygen-cache.outputs.cache-hit != 'true'
        run: |
          archive="doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}/$archive"
          echo "${DOXYGEN_SHA256}  $archive" | sha256sum -c -
          mkdir -p "$HOME/doxygen"
          tar -xzf "$archive" -C "$HOME/doxygen"
          rm "$archive"

      - name: Doxygen을 PATH에 추가
        run: |
          # 압축 안의 폴더 구조에 기대지 않고 실행 파일을 찾아 넣는다.
          bin="$(dirname "$(find "$HOME/doxygen" -type f -name doxygen -perm -u+x | head -n 1)")"
          echo "$bin" >> "$GITHUB_PATH"

      - name: 레퍼런스 빌드와 경고 검사
        run: |
          doxygen --version | grep -q "^${DOXYGEN_VERSION}"
          mkdir -p build-docs
          doxygen Doxyfile 2> build-docs/warnings.txt
          # Korean 번역이 오래됐다는 안내 두 줄은 경고가 아니므로 빼고 센다.
          grep -v -e 'has not been updated' -e 'As a result some sentences' build-docs/warnings.txt \
            | grep -v '^[[:space:]]*$' > build-docs/real-warnings.txt || true
          if [ -s build-docs/real-warnings.txt ]; then
            cat build-docs/real-warnings.txt
            echo "::error title=Doxygen::경고 $(wc -l < build-docs/real-warnings.txt)줄. 공개 헤더의 문서 주석을 고칠 것."
            exit 1
          fi

      - name: Pages 결과물 올리기
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build-docs/html

  # ---------------------------------------------------------------------------
  # main에서만 배포한다. PR과 다른 브랜치의 수동 실행은 빌드까지만 한다.
  # ---------------------------------------------------------------------------
  deploy:
    name: Pages 배포
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v5
